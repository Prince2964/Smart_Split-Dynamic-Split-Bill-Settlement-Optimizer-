<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Invitations — SplitSmart
  </title>
  <link href="css/common.css" rel="stylesheet"/>
  <link href="css/invitations.css" rel="stylesheet"/>
 </head>
 <body data-page="invitations">
  <header id="siteNav">
  </header>
  <main class="app-page">
   <div class="container">
    <div class="page-header">
     <div>
      <span class="eyebrow">
       Group access
      </span>
      <h1>
       Invitations
      </h1>
      <p class="muted">
       Accept groups you've been invited to, or track invitations you've sent.
      </p>
     </div>
     <a class="btn btn-soft" href="my-groups.html">
      View My Groups →
     </a>
    </div>
    <div class="invite-tabs">
     <span class="active">
      Received
      <b id="receivedCount">
       0
      </b>
     </span>
     <span>
      Sent
      <b id="sentCount">
       0
      </b>
     </span>
    </div>
    <section class="panel invitations-panel" id="invitationsList">
    </section>
   </div>
  </main>
  <div class="toast" id="toast">
  </div>
  <script src="js/config.js">
  </script>
  <script src="js/storage.js">
  </script>
  <script src="js/utils.js">
  </script>
  <script src="js/auth.js">
  </script>
  <script src="js/groups.js">
  </script>
  <script src="js/invitations.js">
  </script>
  <script src="js/expenses.js">
  </script>
  <script src="js/calculations.js">
  </script>
  <script src="js/render.js">
  </script>
  <script src="js/navigation.js">
  </script>
  <script src="js/invitations-page.js">
  </script>
  <script src="js/app.js">
  </script>
 </body>
</html>
